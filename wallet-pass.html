<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhawen Maroo - LEADS Digital Wallet Pass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e293b, #090d16);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      color: #0f172a;
    }

    .pass-container {
      perspective: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Apple Wallet Pass Card */
    .wallet-pass {
      width: 320px;
      min-height: 480px;
      background: #ebf9ff;
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: 
        0 20px 45px -10px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset,
        0 0 30px rgba(56, 189, 248, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease;
    }

    .wallet-pass:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset,
        0 0 45px rgba(56, 189, 248, 0.4);
    }

    /* Top Header */
    .pass-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 24px;
    }

    .header-logo {
      width: 46px;
      height: auto;
      object-fit: contain;
    }

    /* Primary Member Section */
    .primary-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .primary-info {
      flex: 1;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }

    .primary-name {
      font-size: 22px;
      font-weight: 800;
      color: #090d16;
      line-height: 1.2;
    }

    .brand-side-logo {
      width: 78px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(2, 132, 199, 0.15));
    }

    /* Secondary Fields */
    .secondary-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .field-value {
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* QR Code Container */
    .qr-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 10px 25px -5px rgba(2, 132, 199, 0.15),
        0 0 0 1px rgba(226, 232, 240, 0.8);
      margin: 0 auto;
      width: 170px;
      height: 170px;
    }

    .qr-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Footer Details */
    .pass-footer {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11.5px;
      color: #64748b;
      font-weight: 600;
    }

    .footer-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-icon {
      font-size: 12px;
    }

    /* Action Button */
    .btn-wallet {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-wallet:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      background: #111827;
    }

    .apple-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="pass-container">
    <!-- Digital Wallet Card -->
    <div class="wallet-pass">
      <div>
        <!-- Top Small Logo -->
        <div class="pass-header">
          <img src="leads-logo.png" alt="LEADS Logo" class="header-logo" />
        </div>

        <!-- Alumni Member Field -->
        <div class="primary-section">
          <div class="primary-info">
            <div class="field-label">Alumni Member</div>

          </div>

        <div class="secondary-fields">

          </div>
          <div>
            <div class="field-label">Email ID</div>
            <div class="field-value" title="bhawenmaroo@gmail.com">bhawenmaroo@gm...</div>

        </div>

        <!-- QR Code Container -->
        <div class="qr-box">
          <img 
            src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https%3A%2F%2Fleadsnextgencentre.online%2Fcard%2Fbhawen-maroo&color=090D16" 
            alt="QR Code"

      </div>

      <!-- Footer Info -->
      <div class="pass-footer">
        <div class="footer-row">
          <span class="footer-icon">&#x21C5;</span>
          <span>5 back fields</span>
        </div>
        <div class="footer-row">
          <span class="footer-icon">&#128179;</span>
          <span>Leads Next Gen Centre</span>
        </div>
      </div>
    </div>

    <!-- Live Add to Wallet Link -->
    <a href="https://api.walletwallet.dev/p/e1f116cc-3aa7-4cd9-8362-123ea660021f" target="_blank" rel="noopener noreferrer" class="btn-wallet">
      <svg class="apple-icon" viewBox="0 0 170 170">

      </svg>
      Add to Apple / Google Wallet

  </div>

</body>
</html>
